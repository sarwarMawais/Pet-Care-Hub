# Pet Care Hub — dependency catalogue.
#
# STATUS: provisional. Every version below comes from the research pass dated 2026-09-15
# (docs/research/kmp-stack-and-motivoa-reuse.md). Pin and re-verify each one against its
# changelog on day one of Phase 0 — several were taken from aggregator sources.
#
# Risk key from the research: [low] safe, [med] watch it, [high] spike before committing.

[versions]
# --- Build ---------------------------------------------------------------
# Raised from the plan's provisional 8.13.2 on 2026-09-17. Compose Multiplatform 1.12.0
# depends on androidx.compose 1.12.0, which refuses to build on AGP below 9.1.0 and below
# compileSdk 37. Verified by a real failing build, not by reading changelogs.
agp = "9.4.0"
# NOTE: purchases-kmp requires Kotlin 2.3.20+. Motivoa sits on 2.2.21 — we start higher here.
kotlin = "2.3.20"
ksp = "2.3.12"                         # verified 2026-09-17 against Maven Central.
# KSP no longer mirrors the Kotlin version. The old "<kotlin>-<ksp>" scheme ended at
# 2.2.21-2.0.5; from 2.3.0 onward KSP versions independently. The value the plan carried
# ("2.3.20-2.0.1") never existed. Check KSP's own release notes for Kotlin compatibility.
# compileSdk and targetSdk are deliberately different. compileSdk 37 is forced by
# androidx.compose 1.12.0 (see the agp note above); targetSdk stays at 36, which is what Play
# actually requires. Compiling against a newer SDK does not opt us into its runtime behaviour.
compileSdk = "37"
targetSdk = "36"                       # Play requires target API 36 (deadline passed 2026-08-31)
minSdk = "26"
javaVersion = "17"

# --- UI ------------------------------------------------------------------
composeMultiplatform = "1.12.0"        # [low] iOS stable since 1.8
navigation3 = "1.1.1"                  # [med] needs CMP >= 1.10; hand-register NavKey serializers off-JVM
lifecycleViewmodel = "2.10.0"          # KMP-capable
activityCompose = "1.13.0"             # Android only: the Activity that hosts the Compose root
composeBom = "2026.09.00"              # Android only: androidApp is not a KMP module (see ADR 0006)

# --- Data ----------------------------------------------------------------
room = "2.8.4"                         # [low] KMP-capable; stay off androidx.room3 until after first ship
sqlite = "2.6.1"                       # androidx.sqlite bundled driver
datastore = "1.2.1"                    # [low]

# --- Backend / sync ------------------------------------------------------
supabase = "3.2.0"                     # [med] supabase-kt BOM; EU region project
powersync = "1.13.0"                   # [med] offline-first sync between SQLite and Postgres
ktor = "3.3.0"

# --- Commerce ------------------------------------------------------------
purchasesKmp = "3.2.0"                 # [low] RevenueCat; bundles iOS SDK, no CocoaPods

# --- Reminders -----------------------------------------------------------
alarmee = "2.2.0"                      # [med] repeating alarms + local notifications, single maintainer
workManager = "2.11.2"                 # Android only: re-materialiser

# --- Files / media -------------------------------------------------------
filekit = "0.12.0"                     # [low] native pickers, no storage permissions
coil = "3.3.0"                         # [low] Coil 3 is the multiplatform one (Coil 2 is Android-only)
peekaboo = "0.5.3"                     # [med] camera + crop, Android/iOS only
pdfkmp = "1.1.0"                       # [med] young; platform-actual fallback documented in the plan

# --- Platform ------------------------------------------------------------
koin = "4.1.1"                         # [low] shortest bridge from Hilt
koinAnnotations = "2.3.0"
kotlinxDatetime = "1.0.0"              # [low] note: java.time patterns do NOT exist here
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.11.0"
glance = "1.2.0"                       # Android widgets only

# --- Observability -------------------------------------------------------
sentry = "0.16.0"                      # sentry-kotlin-multiplatform
aptabase = "0.3.0"                     # privacy-friendly analytics; no IDFA, so no ATT prompt

# --- Test ----------------------------------------------------------------
turbine = "1.2.1"

[libraries]
