org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Kotlin/Native compile times are the #1 local-dev complaint on KMP.
# Both of these are from the research pass; keep them on from day one.
kotlin.incremental.native=true
# kotlin.native.cacheKind was REMOVED in Kotlin 2.3.20 (it now only prints a deprecation
# warning and does nothing). The research pass that recommended it predates that release.
# See https://kotl.in/disable-native-cache for the replacement DSL if caching ever needs
# disabling; the default is what we want, so nothing is set here.

# Only CI needs release linking (it is ~10x slower than debug).
# During local dev, build the framework for one architecture only.
kotlin.native.ignoreDisabledTargets=true
